services:
  bigbro-nginx:
    container_name: bigbro-nginx
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - bigbro-network
    depends_on:
      - bigbro-application

  bigbro-application:
    container_name: bigbro-application
    build:
      dockerfile: Dockerfile
      context: .
    env_file:
      - ~/.env
    networks:
      - bigbro-network
    depends_on:
      - bigbro-postgres
      - bigbro-redis
    ports:
      - "8000:8000"
